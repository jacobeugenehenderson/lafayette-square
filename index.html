<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Lafayette Square</title>

    <!-- Open Graph — read ONLY by lafayette-square.com (GitHub Pages serves this file as-is, and worker.js swaps this
         block, by this comment, for a place's card). The site Workers remove these and write each town's whole card
         (src/lib/shareCard.js#withShareCard). ⛔ No town's image is named here. -->
    <meta property="og:title" content="Lafayette Square" />
    <meta property="og:image" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lafayette-square.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lafayette Square" />
    <meta name="twitter:image" content="" />
    <script>
      // Apply accessible class before first paint to avoid CSS repaint spike
      try { if (localStorage.getItem('lsq-accessible') === '1') document.documentElement.classList.add('accessible') } catch(e) {}
    </script>
    <script>
      // SPA path restoration for GitHub Pages 404.html redirect
      (function () {
        var sp = new URLSearchParams(location.search);
        var spaPath = sp.get('__spa_path');
        if (spaPath) {
          sp.delete('__spa_path');
          var remaining = sp.toString();
          var url = spaPath + (remaining ? (spaPath.indexOf('?') !== -1 ? '&' : '?') + remaining : '');
          history.replaceState(null, '', url);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
