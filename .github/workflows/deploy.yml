name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check suite (safe tier)
        # ⭐ The `safe` tier only: checks that read repo files and contact nothing. The tier is
        # DERIVED from each check's source at run time (`checks/tier.mjs`), never from a list, so a
        # check added tomorrow is gated without anyone remembering to gate it.
        # ⛔ `local-effect` (writes to disk) and `live` are excluded by construction. `live` includes
        # `claims-onboarding-guard.sh`, which POSTs /auth/v1/signup at the production Supabase
        # project with no teardown — CI must never be able to reach it.
        #
        # ⚠️⚠️ NON-BLOCKING, AND THIS IS A HOLD, NOT A DESIGN. Measured 2026-09-13 on a fresh
        # clone — which is exactly what this runner gets:
        #       local working tree : 82/126 green
        #       fresh clone        : 36/126 green, 89 red
        # The 47-check difference is not code quality. `public/baked/` is gitignored (0 tracked
        # files), so most of the corpus has no artifact to measure here and fails for want of
        # DATA, not for want of correctness. Blocking on that would break every deploy for a
        # reason no commit can fix.
        # ⛔ `continue-on-error` is a fallback, and this repo's Layer 0 forbids exactly this shape
        # — a run that looks successful while having checked almost nothing. It is accepted ONLY
        # as a visible, dated hold with the decision named, never as the answer:
        #   (a) bake the artifacts in CI before this step, or
        #   (b) give "cannot measure — no data" its own exit code so the runner buckets it as
        #       NOT CHECKED rather than RED (the same distinction already drawn for timeouts),
        #       and CI is honest about how much it actually checked.
        # ▶ Reproduce: git clone --depth 1 file://$PWD /tmp/c && cd /tmp/c && npm test
        continue-on-error: true
        run: npm test

      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Where the BAKED SLAB is served from (R2 custom domain). Unset ⇒ falls
          # back to BASE_URL, i.e. the slab committed in this repo. See
          # src/lib/bakedUrl.js and plans/r2-asset-offload.md.
          VITE_ASSET_BASE: ${{ vars.VITE_ASSET_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
