<!doctype html>
<meta charset="utf-8"><title>embed probe</title>
<style>html,body{margin:0;background:#0d1117;color:#cdd6e4;font:12px/1.5 ui-monospace,Menlo,monospace}
iframe{display:block;width:472px;height:420px;border:1px solid #2b3442}pre{padding:8px;white-space:pre-wrap}</style>
<iframe id="f" src="/?embed=tree"></iframe>
<pre id="out">…</pre>
<script>
const MIN = Number(new URLSearchParams(location.search).get('min') ?? 600);
const f=document.getElementById('f'), out=document.getElementById('out');
setInterval(()=>{ try{ f.contentWindow.postMessage({type:'ward-time',minute:MIN},'*') }catch{} }, 700);
// sample the diagnostic over time — we are looking for a tree that appears then goes
const hist=[];
setInterval(()=>{
  let d=null; try{ d=f.contentWindow.__d }catch(e){}
  hist.push(JSON.stringify(d));
  out.textContent = 'minute='+MIN+'\n' + hist.slice(-8).join('\n');
}, 1000);
</script>
